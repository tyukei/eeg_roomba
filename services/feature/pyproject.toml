[project]
name = "feature-svc"
version = "0.1.0"
description = "Welch PSD -> alpha/beta/theta band power -> MQTT + DB"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "asyncpg>=0.29",
  "paho-mqtt>=1.6,<2",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
