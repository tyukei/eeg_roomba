[project]
name = "api-svc"
version = "0.1.0"
description = "WebUI backend: FastAPI + WebSocket MQTT proxy + history REST"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "asyncpg>=0.29",
  "httpx>=0.27",
  "paho-mqtt>=1.6,<2",
  "google-genai>=1.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
