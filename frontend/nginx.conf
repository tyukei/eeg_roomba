server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API REST endpoints — must be matched before the SPA fallback below,
  # otherwise nginx serves index.html and the request never reaches FastAPI.
  location /control/ {
    proxy_pass http://api:8080;
  }
  location = /threshold {
    proxy_pass http://api:8080;
  }
  location = /chat {
    proxy_pass http://api:8080;
    proxy_read_timeout 60s;     # Gemini calls can take a few seconds
  }
  location = /analyze-eeg {
    proxy_pass http://api:8080;
    proxy_read_timeout 60s;
    # FastAPI rejects > 4 MB binary (≈ 5.5 MB base64). Cap nginx slightly
    # above that so the server's typed 413 always wins over nginx's HTML 413.
    client_max_body_size 6m;
  }
  # Autopilot orchestrator (start/stop/status). Without this prefix, POSTs
  # fall through to the SPA fallback below and nginx replies 405 against
  # static index.html.
  location /autopilot/ {
    proxy_pass http://api:8080;
    # Gemini Robotics calls can take several seconds per iteration; keep
    # the door open long enough for /autopilot/start's preflight to return.
    proxy_read_timeout 60s;
  }

  # MJPEG stream: disable response buffering so each JPEG part flushes
  # to the browser immediately. Long read timeout to keep the stream open.
  location /camera/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
