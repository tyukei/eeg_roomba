services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - tsdb_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./configs/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  ingest:
    build: ./services/ingest
    restart: unless-stopped
    # host networking is required for LSL multicast discovery
    network_mode: host
    env_file: .env
    environment:
      # On host network, container-network DNS names don't resolve.
      # timescaledb/mosquitto publish their ports on host, so use localhost.
      POSTGRES_HOST: localhost
      MQTT_HOST: localhost
    depends_on:
      timescaledb:
        condition: service_healthy
      mosquitto:
        condition: service_started

  feature:
    build: ./services/feature
    restart: unless-stopped
    env_file: .env
    depends_on:
      timescaledb:
        condition: service_healthy
      mosquitto:
        condition: service_started

  decision:
    build: ./services/decision
    restart: unless-stopped
    env_file: .env
    depends_on:
      mosquitto:
        condition: service_started

  api:
    build: ./services/api
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      timescaledb:
        condition: service_healthy
      mosquitto:
        condition: service_started

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  tsdb_data:
  mosquitto_data:
  mosquitto_log:
